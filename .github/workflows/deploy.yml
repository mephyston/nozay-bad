name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force le déploiement de toutes les applications"
        type: boolean
        default: true

# Un seul déploiement à la fois par branche
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: "22"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'staging')
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # 1. Détecte les apps affectées avec nx affected
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    # Indépendant de `release` : tourne en parallèle du semantic-release au lieu
    # d'attendre derrière lui. Seul `deploy-admin` a besoin de la version publiée.
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      storefront: ${{ steps.affected.outputs.storefront }}
      website: ${{ steps.affected.outputs.website }}
      admin: ${{ steps.affected.outputs.admin }}
      ds: ${{ steps.affected.outputs.ds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Detect affected projects
        id: affected
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          if [ "${{ github.event.inputs.force_all }}" = "true" ] || echo "$COMMIT_MSG" | grep -qiE "force deploy|deploy all"; then
            echo "Forcing deployment of all applications"
            API_AFFECTED="true"
            STOREFRONT_AFFECTED="true"
            ADMIN_AFFECTED="true"
            DS_AFFECTED="true"
          else
            AFFECTED=$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD 2>/dev/null || echo "")
            echo "Affected projects: [$AFFECTED]"

            if echo "$AFFECTED" | grep -qx 'api'; then API_AFFECTED="true"; else API_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'storefront'; then STOREFRONT_AFFECTED="true"; else STOREFRONT_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'website'; then WEBSITE_AFFECTED="true"; else WEBSITE_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'admin'; then ADMIN_AFFECTED="true"; else ADMIN_AFFECTED="false"; fi
            # Le visual regression ne couvre que le design system (@nba/ui) : inutile
            # de le jouer quand seuls admin/storefront changent sans toucher le DS.
            if echo "$AFFECTED" | grep -qx '@nba/ui'; then DS_AFFECTED="true"; else DS_AFFECTED="false"; fi
          fi

          echo "api=$API_AFFECTED" >> $GITHUB_OUTPUT
          echo "storefront=$STOREFRONT_AFFECTED" >> $GITHUB_OUTPUT
          echo "website=$WEBSITE_AFFECTED" >> $GITHUB_OUTPUT
          echo "admin=$ADMIN_AFFECTED" >> $GITHUB_OUTPUT
          echo "ds=$DS_AFFECTED" >> $GITHUB_OUTPUT

          echo "Debug outputs → api=$API_AFFECTED storefront=$STOREFRONT_AFFECTED admin=$ADMIN_AFFECTED website=$WEBSITE_AFFECTED ds=$DS_AFFECTED"

  # ──────────────────────────────────────────────────────────────
  # 2. Tests affectés (exécutés sur PR et sur Push)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test affected
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Verify environment variable & binding declarations
        run: node scripts/check-env-declarations.js

      # Les migrations D1 sont suivies par nom de fichier : un renommage rejoue la
      # migration sur les bases existantes (cf. duplication des catégories du 29/07).
      - name: Verify migrations are append-only
        run: node scripts/check-migrations-append-only.js

      - name: Verify schema integrity & reference data
        run: node scripts/check-schema-integrity.js

      - name: Run TypeScript typecheck
        run: npm run typecheck

      # Ne teste que les fichiers liés aux changements depuis le dernier vert (NX_BASE).
      # Filet de sécurité : forceRerunTriggers (vitest.config.ts) relance TOUTE la suite si
      # une migration D1, wrangler.json ou une config racine change (deps hors graphe d'imports).
      # Plus de CLOUDFLARE_API_TOKEN : le pool tourne 100 % local (config de test sans binding AI).
      - name: Run affected tests
        run: npx vitest run --changed "$NX_BASE" --passWithNoTests

      # Tests d'architecture (frontières d'import inter-libs) : transverses, donc joués
      # systématiquement — un --changed pourrait les rater.
      - name: Run architecture tests
        run: npx vitest run --project architecture-tests

  # ──────────────────────────────────────────────────────────────
  # 2b. Régression visuelle du design system (Storybook + Playwright)
  #     Sur Linux (×1 en facturation Actions). Les références -linux sont
  #     générées/commitées par le workflow visual-baselines.yml.
  # ──────────────────────────────────────────────────────────────
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ds == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache miss : téléchargement complet du navigateur + deps système.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit : le navigateur est restauré, seules les deps OS (apt) manquent.
      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - name: Build Storybook
        run: npx nx build-storybook @nba/ui
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

      - name: Run visual regression
        run: npm run test:visual

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            tests/visual/**/*.png
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy API (en premier — les autres apps en dépendent via Service Binding)
  # ──────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, test, visual]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.api == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler d1 migrations apply nba-db --remote
          else
            npx wrangler d1 migrations apply nba-db-staging --remote --env staging
          fi

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy Storefront & Admin en parallèle (après API)
  # ──────────────────────────────────────────────────────────────
  deploy-storefront:
    name: Deploy Storefront Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, test, visual, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.storefront == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped') && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - name: Build Storefront (Astro SSR)
        env:
          # Site key Turnstile (publique) — inline par Astro au build. Widget avec les
          # hostnames my.nozaybad.fr + staging-my.nozaybad.fr (staging et prod partagés).
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAD1TY7I_ql47XOjI
          # Environnement inliné au build : bandeau + icône PWA (TEST en staging).
          PUBLIC_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          # Clé publique VAPID (publique par nature) — inlinée au build pour
          # pushManager.subscribe(). Une paire par environnement : cette valeur doit
          # rester identique au VAPID_PUBLIC_KEY du Worker nba-api correspondant
          # (apps/api/wrangler.json), sinon les abonnements sont rejetés.
          PUBLIC_VAPID_PUBLIC_KEY: ${{ github.ref_name == 'main' && 'BGLR2qQYt7FsbrqkNjx2p9p--tZuvKCBwj7YBZ5Di7Un1uwkiVXY3SWHi33zuZWltVAOJTsBsAZNaz7bRolHXo4' || 'BJiMPuOGVz144IXpSHoh_XthNFdB-uSV0qGEMc2D-FeheQqVaBmfCUIVa2notPKe3AI2Z4cpP3bgb6dlS5jyLUw' }}
        run: npx nx build storefront

      - name: Deploy Storefront Worker
        working-directory: apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            delete cfg.images;
            cfg.workers_dev = false; // désactive l'URL *.workers.dev : seul le domaine custom reste
            if (process.env.REF_NAME !== 'main') {
              cfg.name = 'nba-storefront-staging';
              cfg.services = [{ binding: 'API_SERVICE', service: 'nba-api-staging' }];
              cfg.kv_namespaces = [{ binding: 'RATE_LIMIT_KV', id: 'e1f0b19b7ea44399ba66d10fe7907ce9' }];
              cfg.vars = cfg.vars || {};
              // INTERNAL_API_KEY : jamais en clair ici. Posée via `wrangler secret put`
              // sur nba-storefront-staging (voir C-01 de l'audit sécurité).
              // Anti-envoi aux adhérents sur staging : mode allowlist restreint à l'admin.
              // (Le build reprend EMAIL_MODE=live destiné à la prod → on override ici.)
              cfg.vars.EMAIL_MODE = 'allowlist';
              cfg.vars.EMAIL_ALLOWLIST = 'david.pagnacco@gmail.com';
            }
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg, null, 2));
          "
          npx wrangler deploy

  deploy-website:
    name: Deploy Website Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, test, visual, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.website == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped') && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - name: Build Website (Astro SSR)
        env:
          # Inliné au build : pilote `site`, l'URL canonique et le robots.txt.
          PUBLIC_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: npx nx build website

      - name: Deploy Website Worker
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            // L'adaptateur Astro injecte une KV 'SESSION' sans id : telle quelle, elle
            // fait échouer le déploiement. Le site public n'a de toute façon pas de session.
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            delete cfg.images;
            cfg.workers_dev = false; // seul le domaine custom reste joignable
            if (process.env.REF_NAME !== 'main') {
              cfg.name = 'nba-website-staging';
              cfg.services = [{ binding: 'API_SERVICE', service: 'nba-api-staging' }];
              cfg.vars = Object.assign({}, cfg.vars, {
                SITE_URL: 'https://staging-www.nozaybad.fr',
                APP_ENV: 'staging'
              });
              // INTERNAL_API_KEY : jamais en clair ici. Posée par wrangler secret put
              // sur nba-website-staging.
            }
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg, null, 2));
          "
          npx wrangler deploy

  deploy-admin:
    name: Deploy Admin Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, test, visual, deploy-api, release]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.admin == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped') && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - name: Build Admin (Astro SSR)
        env:
          VITE_APP_VERSION: ${{ needs.release.outputs.version }}
          # Environnement inliné au build : bandeau + icône PWA (TEST en staging).
          PUBLIC_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: npx nx build admin

      - name: Deploy Admin Worker
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            delete cfg.images;
            cfg.workers_dev = false; // désactive l'URL *.workers.dev : seul le domaine custom reste
            if (process.env.REF_NAME !== 'main') {
              cfg.name = 'nba-admin-staging';
              cfg.services = [{ binding: 'API_SERVICE', service: 'nba-api-staging' }];
              cfg.vars = cfg.vars || {};
              // INTERNAL_API_KEY : jamais en clair ici. Posée via `wrangler secret put`
              // sur nba-admin-staging (voir C-01 de l'audit sécurité).
            }
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg, null, 2));
          "
          npx wrangler deploy
