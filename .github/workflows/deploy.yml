name: CI & déploiement staging

# Développement sur tronc unique : `main` est la seule branche durable et ne déploie
# QUE la préproduction. La production est déployée par promote.yml, sur action
# volontaire. Voir CONTRIBUTING.md.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: "Redéployer toutes les applications sur staging (ignorer nx affected)"
        type: boolean
        default: false

concurrency:
  # Un seul déploiement staging à la fois ; les runs de PR, eux, s'annulent entre eux.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || 'staging' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lecture seule par défaut ; seul `release` écrit (tags et Releases GitHub).
# `actions: read` sert à nx-set-shas, qui cherche le dernier run vert de main.
permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22"
  # Interrupteur du DAST. "true" : un verdict FAIL de ZAP (règles marquées FAIL dans
  # .zap/rules.tsv) rend le run rouge, et la promotion refuse le commit. Repasser à
  # "false" ne sert qu'à débloquer un faux positif le temps de le traiter.
  #
  # Le 03/09/2026, Bot Fight Mode challengeait le runner GitHub sur `/` et
  # `/sitemap.xml` des deux cibles staging, et ZAP prenait la page de challenge pour
  # une page à nous (HSTS absent). Sur le plan Free ce produit n'admet aucune
  # exception, la règle WAF « Scanner ZAP » (en-tête X-Scan-Token) jouait sans effet :
  # il a été désactivé, les règles perso, les règles gérées et Turnstile suffisent.
  # Si le DAST rougit à nouveau sur HSTS avec une CSP à nonce dans l'évidence, c'est
  # qu'un challenge est revenu.
  DAST_BLOQUANT: "true"

jobs:
  # Derrière les tests, et non à côté d'eux.
  #
  # `release` ne dépendait de rien : il posait le tag et publiait la GitHub Release en
  # parallèle de `static-checks`, `test` et `visual`. Un run rouge laissait donc une
  # version publiée que rien ne ferait jamais tourner — le dépôt annonçait une v2.2.3
  # dont aucun Worker ne portait le code. Une version publiée est un fait public et
  # définitif : elle ne doit exister que pour du code qu'on est prêt à déployer.
  #
  # Le prix est assumé : la publication attend la fin des tests, soit un quart d'heure
  # de plus. Personne ne regarde un tag pendant ce temps, et il vaut mieux tard que faux.
  #
  # Même forme d'`if` que `deploy-api` et `deploy-apps` plus bas : `always()` est
  # nécessaire pour que le job survive à un `visual` *ignoré* — sans lui, un job sauté
  # en amont saute aussi tout ce qui en dépend —, et chaque dépendance est donc
  # réexaminée à la main, en distinguant « réussi » de « sauté ».
  release:
    name: Version, changelog et release GitHub
    runs-on: ubuntu-latest
    needs: [static-checks, test, visual, security]
    if: always() && github.event_name == 'push' && needs.static-checks.result == 'success' && needs.security.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pas d'identifiants git conservés, ici non plus : semantic-release s'authentifie
          # lui-même auprès de GitHub avec GITHUB_TOKEN (recette officielle).
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Nomenclature logicielle (SBOM, CycloneDX) des dépendances de production,
      # dérivée du lockfile et jointe à la Release GitHub (assets, package.json).
      # Elle répond en une requête à « la 3.12 embarque-t-elle ce paquet ? » sans
      # rejouer l'installation du commit de l'époque.
      #
      # Sans les optionnelles : `npm sbom` valide l'arbre et refuse (ESBOMPROBLEMS) les
      # dépendances empaquetées d'un fallback wasm (@tailwindcss/oxide-wasm32-wasi) qui
      # déclarent des versions étrangères au lockfile. Ces binaires par plateforme ne
      # font de toute façon pas partie du bundle déployé sur Workers.
      - name: Générer le SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev --omit optional --package-lock-only > sbom.cdx.json

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # 1. Détecte les apps affectées avec nx affected
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    # En tête de graphe, sans dépendance : la détection conditionne `test` et `visual`,
    # eux-mêmes en amont de `release` depuis que la publication attend les tests.
    name: Périmètre du push (nx affected)
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      storefront: ${{ steps.affected.outputs.storefront }}
      website: ${{ steps.affected.outputs.website }}
      admin: ${{ steps.affected.outputs.admin }}
      ds: ${{ steps.affected.outputs.ds }}
      # Tableau JSON des applications Astro à déployer, consommé par la matrice de
      # `deploy-apps`. Vaut '[]' quand aucune n'est affectée : le job est alors ignoré.
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          # L'action prend le dernier run vert de la branche nommée ici. Sur un tronc
          # unique il n'y a qu'un candidat : `main`, aussi bien pour un push que pour le
          # SHA d'origine d'une PR.
          main-branch-name: main

      - name: Detect affected projects
        id: affected
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          if [ "$FORCE_ALL" = "true" ] || echo "$COMMIT_MSG" | grep -qiE "force deploy|deploy all"; then
            echo "Forcing deployment of all applications"
            API_AFFECTED="true"
            STOREFRONT_AFFECTED="true"
            WEBSITE_AFFECTED="true"
            ADMIN_AFFECTED="true"
            DS_AFFECTED="true"
          else
            AFFECTED=$(npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" 2>/dev/null || echo "")
            echo "Affected projects: [$AFFECTED]"

            if echo "$AFFECTED" | grep -qx 'api'; then API_AFFECTED="true"; else API_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'storefront'; then STOREFRONT_AFFECTED="true"; else STOREFRONT_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'website'; then WEBSITE_AFFECTED="true"; else WEBSITE_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'admin'; then ADMIN_AFFECTED="true"; else ADMIN_AFFECTED="false"; fi
            # Le visual regression ne couvre que le design system : inutile de le jouer
            # quand seuls admin/storefront changent sans y toucher.
            #
            # Le déclencheur suit les CHEMINS modifiés et non le graphe Nx, qui répondait
            # trop souvent oui : toute modification d'un fichier racine — `package.json`,
            # `tsconfig.base.json`, `nx.json` — marque l'intégralité des projets comme
            # affectés, `@nba/ui` compris. Ajouter un script npm suffisait donc à faire
            # installer Playwright et rejouer toutes les captures, pour rien.
            #
            # La liste couvre ce dont le harnais dépend réellement : les composants et
            # leurs stories, la configuration Storybook, les tests eux-mêmes et celle de
            # Playwright.
            DS_PATHS='^(libs/shared/ui/|\.storybook/|tests/visual/|playwright\.config\.ts)'
            if git diff --name-only "$NX_BASE" "$NX_HEAD" | grep -qE "$DS_PATHS"; then
              DS_AFFECTED="true"
            else
              DS_AFFECTED="false"
            fi
          fi

          # Tableau JSON pour la matrice de `deploy-apps`. Formulé en `if` plutôt qu'en
          # `[ ... ] && ...` : sous `bash -e`, une telle ligne placée en fin de step
          # ferait échouer le job dès qu'une application n'est pas affectée.
          LIST=""
          if [ "$STOREFRONT_AFFECTED" = "true" ]; then LIST="$LIST storefront"; fi
          if [ "$WEBSITE_AFFECTED" = "true" ]; then LIST="$LIST website"; fi
          if [ "$ADMIN_AFFECTED" = "true" ]; then LIST="$LIST admin"; fi
          # $LIST volontairement sans guillemets : c'est le découpage en mots qui fait
          # une ligne par application.
          # shellcheck disable=SC2086
          APPS=$(printf '%s\n' $LIST | jq -R . | jq -sc 'map(select(length>0))')

          {
            echo "apps=$APPS"
            echo "api=$API_AFFECTED"
            echo "storefront=$STOREFRONT_AFFECTED"
            echo "website=$WEBSITE_AFFECTED"
            echo "admin=$ADMIN_AFFECTED"
            echo "ds=$DS_AFFECTED"
          } >> "$GITHUB_OUTPUT"

          echo "Debug outputs → api=$API_AFFECTED storefront=$STOREFRONT_AFFECTED admin=$ADMIN_AFFECTED website=$WEBSITE_AFFECTED ds=$DS_AFFECTED"

  # ──────────────────────────────────────────────────────────────
  # 2a. Vérifications statiques : garde-fous, typecheck, tests d'architecture.
  #     En PARALLÈLE du job test — le typecheck monorepo entier vivait en série
  #     devant vitest et allongeait d'autant le chemin critique des déploiements.
  #     Aucun needs : rien ici ne dépend du calcul d'affected.
  # ──────────────────────────────────────────────────────────────
  static-checks:
    name: Garde-fous, typecheck et architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pas d'historique : aucun de ces contrôles n'en a besoin
          # (check-schema-integrity fait un git log -1, couvert par le commit de tête).
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify environment variable & binding declarations
        run: node scripts/check-env-declarations.js

      # Les migrations D1 sont suivies par nom de fichier : un renommage rejoue la
      # migration sur les bases existantes (cf. duplication des catégories du 29/07).
      - name: Verify migrations are append-only
        run: node scripts/check-migrations-append-only.js

      - name: Verify schema integrity & reference data
        run: node scripts/check-schema-integrity.js

      # Nx ne lit pas les imports des fichiers .astro/.svelte : les dépendances qui en
      # découlent sont déclarées à la main dans les project.json. Sans ce contrôle, un
      # import ajouté sans sa déclaration laisse l'application hors du calcul d'affected,
      # donc ni testée ni redéployée quand la lib change — et personne ne le voit.
      - name: Verify Nx dependency graph covers every @nba/* import
        run: node scripts/check-nx-deps.js

      # Un alias @nba/* se déclare dans plusieurs tables : tsconfig.base.json pour les
      # types, les paths de chaque application Astro pour sa build, et la configuration de
      # test de chaque projet pour Vite, qui ne lit pas les paths de TypeScript. L'oubli
      # ne se voit qu'en exécutant la bonne chose — la build d'une application, ou la
      # suite d'un projet précis — donc souvent après coup, le reste étant vert.
      - name: Verify alias tables cover every @nba/* import
        run: node scripts/check-aliases.js

      # Racine et env.staging doivent déclarer les mêmes clés : une ressource définie
      # d'un seul côté devient une ressource de production utilisée en préproduction.
      # C'est ainsi que la préproduction avait hérité du compartiment R2 de production.
      - name: Verify wrangler env parity
        run: node scripts/patch-wrangler.mjs --check

      - name: Run TypeScript typecheck
        run: npm run typecheck

      # ESLint : `no-undef` sur les .svelte (rien d'autre ne les contrôle), étanchéité
      # VSA et règles de couches (no-restricted-imports), pas de comparaison sur les
      # libellés dans les dépôts. Le plugin Nx lit le graphe de projets : `nx show
      # projects` le calcule d'abord, sinon sa règle se tait sur un simple avertissement.
      # setup-node a enregistré le problem matcher d'ESLint : chaque verdict devient une
      # annotation sur la ligne fautive.
      - name: Run ESLint
        run: |
          npx nx show projects > /dev/null
          npx eslint . --max-warnings 0

      # Tests d'architecture (frontières d'import inter-libs) : transverses, donc joués
      # systématiquement — un --changed pourrait les rater. Config dédiée sans pool
      # Workers : l'ancienne invocation `--project architecture-tests` évaluait les 30
      # projets de la config racine et bootait le pool pour 4 fichiers node.
      - name: Run architecture tests
        run: npx vitest run --config vitest.architecture.config.ts

  # ──────────────────────────────────────────────────────────────
  # 2. Tests affectés (exécutés sur PR et sur Push)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Tests affectés
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Cache du transform Vite/Vitest (node_modules/.vite/*). Placé APRÈS npm ci :
      # npm ci vide node_modules, une restauration antérieure serait perdue. La clé
      # inclut le SHA — toujours un miss — pour forcer la resauvegarde à chaque run
      # (actions/cache ne resauvegarde jamais sur hit exact) ; restore-keys restaure
      # le plus récent du même lockfile.
      - name: Cache Vite transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          # L'action prend le dernier run vert de la branche nommée ici. Sur un tronc
          # unique il n'y a qu'un candidat : `main`, aussi bien pour un push que pour le
          # SHA d'origine d'une PR.
          main-branch-name: main

      # Ne teste que les fichiers liés aux changements depuis le dernier vert (NX_BASE).
      # Filet de sécurité : forceRerunTriggers (vitest.config.ts) relance TOUTE la suite si
      # une migration D1, wrangler.json ou une config racine change (deps hors graphe d'imports).
      # Plus de CLOUDFLARE_API_TOKEN : le pool tourne 100 % local (config de test sans binding AI).
      # Les garde-fous, le typecheck et les tests d'architecture vivent dans static-checks,
      # en parallèle.
      - name: Run affected tests
        run: npx vitest run --changed "$NX_BASE" --passWithNoTests

  # ──────────────────────────────────────────────────────────────
  # 2b. Régression visuelle du design system (Storybook + Playwright)
  #     Sur Linux (×1 en facturation Actions). Les références -linux sont
  #     générées/commitées par le workflow visual-baselines.yml.
  # ──────────────────────────────────────────────────────────────
  visual:
    name: Régression visuelle du design system
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ds == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache miss : téléchargement complet du navigateur + deps système.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit : le navigateur est restauré ; les bibliothèques système sont déjà
      # presque toutes présentes sur ubuntu-latest, cet apt n'est qu'un complément.
      # Best effort borné : le 17/08, un miroir apt au ralenti a tenu ce step 15 min
      # et bloqué les déploiements — un apt qui traîne ne doit jamais coûter plus de
      # 3 min ni faire échouer le job (si une lib manquait vraiment, le lancement de
      # Chromium échouerait juste après, avec un message explicite).
      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Cache Nx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - name: Build Storybook
        run: npx nx build-storybook @nba/ui
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

      - name: Run visual regression
        run: npm run test:visual

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            tests/visual/**/*.png
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # 2c. Sécurité : secrets, SAST, dépendances, workflows. En parallèle des autres
  #     vérifications ; bloque le déploiement staging, donc la promotion.
  #
  #     Le dépôt est privé sur un plan Free : l'onglet Security de GitHub (CodeQL,
  #     secret scanning, dependency review) lui est fermé. Tout ce qui suit est donc
  #     libre et tourne ici ; la restitution passe par les annotations (`::error`)
  #     et le résumé du job, pas par un tableau de bord.
  # ──────────────────────────────────────────────────────────────
  security:
    name: Secrets, SAST, dépendances et workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sur une PR, gitleaks-action demande à l'API la liste des commits à scanner ;
      # sans ce droit il échoue avant d'avoir rien lu (« Resource not accessible »).
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : gitleaks lit les commits, pas seulement l'arbre.
          fetch-depth: 0
          persist-credentials: false

      # Gratuit pour un compte personnel (une licence n'est exigée que des
      # organisations). Sur un push, l'action ne relit que les commits poussés ; les
      # exceptions vivent dans .gitleaks.toml et .gitleaksignore.
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # Semgrep Community : règles TypeScript, Node, OWASP Top 10 et GitHub Actions,
      # seules celles de sévérité ERROR bloquent. Image `latest` à dessein : ce sont
      # les règles du registre qui comptent, et elles exigent un moteur récent. Les
      # verdicts sont rejoués en annotations, l'image ne le fait pas elle-même.
      - name: SAST (Semgrep)
        run: |
          status=0
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan \
              --config p/typescript --config p/nodejs --config p/owasp-top-ten --config p/github-actions \
              --metrics=off --severity ERROR --error --quiet --json -o semgrep.json . || status=$?
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),title=\(.check_id)::\(.extra.message | gsub("\n"; " "))"' semgrep.json
          {
            echo "### SAST (Semgrep)"
            echo "Verdicts bloquants : $(jq '.results | length' semgrep.json)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Vulnérabilités connues des dépendances (package-lock.json). Bloque sur HIGH et
      # CRITICAL munies d'un correctif ; les exceptions datées vivent dans
      # .trivyignore.yaml. Dependabot ouvre les PR de correction, Trivy refuse de
      # déployer tant qu'elles ne sont pas fusionnées.
      - name: Dépendances (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-dirs: node_modules

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Chaque paquet installé porte la signature du registre npm : un paquet substitué
      # entre le registre et le runner (miroir, cache, proxy) ne la porte pas.
      - name: Intégrité des paquets (npm audit signatures)
        run: npm audit signatures

      # Les workflows sont une surface d'attaque à part entière : zizmor audite leurs
      # motifs dangereux (injection par gabarit, actions non épinglées, droits trop
      # larges…), actionlint leur syntaxe et leurs expressions. Les exceptions de
      # zizmor sont motivées dans .github/zizmor.yml.
      - name: Workflows (zizmor, actionlint)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.30.0 --no-progress .github
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy API (en premier — les autres apps en dépendent via Service Binding)
  # ──────────────────────────────────────────────────────────────
  deploy-api:
    name: Déployer l'API (staging)
    runs-on: ubuntu-latest
    needs: [detect-changes, test, visual, static-checks, security]
    # `!= 'pull_request'` et non `== 'push'` : le déclenchement manuel forçait les
    # booléens à true puis ne déployait rien, tous les jobs étant filtrés sur `push`.
    if: always() && github.event_name != 'pull_request' && needs.detect-changes.outputs.api == 'true' && needs.static-checks.result == 'success' && needs.security.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # L'API n'utilise pas l'action composite : sa configuration n'est pas redirigée
      # par l'adaptateur Astro, donc `--env staging` fonctionne nativement.
      - name: Run D1 migrations (staging)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nba-db-staging --remote --env staging

      - name: Deploy API Worker (staging)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy des 3 applications Astro affectées, en parallèle (après l'API)
  # ──────────────────────────────────────────────────────────────
  deploy-apps:
    name: Déployer ${{ matrix.app }} (staging)
    runs-on: ubuntu-latest
    needs: [detect-changes, test, visual, static-checks, security, deploy-api, release]
    if: always() && github.event_name != 'pull_request' && needs.detect-changes.outputs.apps != '[]' && needs.static-checks.result == 'success' && needs.security.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped') && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique et tags complets : l'action résout la version affichée par
          # `git describe`, et un checkout superficiel la priverait de tout repère.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/deploy-app
        with:
          app: ${{ matrix.app }}
          env: staging
          # Simple indice, souvent vide : `release` ne coupe rien sur un `chore:` ou un
          # `docs:`, et il est carrément ignoré sur un `workflow_dispatch`. L'action
          # retombe alors sur le dernier tag atteignable — la version qui tourne
          # réellement — plutôt que sur un « 0.0.0 » qui ressemblait à une panne.
          app-version: ${{ needs.release.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          node-version: ${{ env.NODE_VERSION }}

  # ──────────────────────────────────────────────────────────────
  # Invalider le cache du site public après le déploiement.
  #
  # La version de contenu entre dans la clé de cache des pages : l'incrémenter rend d'un
  # coup toutes les entrées précédentes inatteignables. Les handlers du CMS le font à
  # chaque publication, et `invalidatePublicContent` à chaque écriture sur les créneaux ou
  # les événements — mais rien ne le faisait pour un **déploiement**.
  #
  # Or un changement de gabarit ou de composant modifie le HTML à contenu identique : les
  # points de présence qui ont déjà la page continuaient de servir l'ancien rendu jusqu'à
  # l'expiration du TTL. Correction invisible, sans que rien ne le signale.
  #
  # Après le déploiement, jamais avant : invalider d'abord laisserait les requêtes
  # suivantes remplir le cache avec l'ancien code encore en ligne.
  #
  # Seulement si le site a été déployé — invalider sur une livraison d'API seule viderait
  # le cache pour rien.
  # ──────────────────────────────────────────────────────────────
  invalidate:
    name: Invalider le cache du site public (staging)
    needs: [detect-changes, deploy-apps]
    if: always() && needs.deploy-apps.result == 'success' && contains(needs.detect-changes.outputs.apps, 'website')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Incrémenter cms_content_version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler d1 execute nba-db-staging --remote
          --command "UPDATE cms_content_version SET version = version + 1, updated_at = unixepoch() WHERE id = 1;"

  # ──────────────────────────────────────────────────────────────
  # 5. DAST : ZAP en scan passif (« baseline ») sur la préproduction qui vient
  #    d'être déployée, site public et boutique. Dans le MÊME run que le
  #    déploiement, exprès : un verdict rouge rend le run rouge, et le garde de
  #    promote.yml refuse alors le commit. Le scan actif complet, long et bruyant,
  #    n'a pas sa place ici ; il se joue à la main ou sur planning.
  #
  #    Non authentifié par nature : l'admin est derrière Access et la boutique
  #    derrière un OTP, seules leurs surfaces publiques sont vues.
  #
  #    Cloudflare voit arriver un scanner : prévoir une règle WAF « skip » sur la zone
  #    quand l'en-tête X-Scan-Token porte la valeur du secret ZAP_WAF_TOKEN (à créer
  #    des deux côtés). Tant que le secret n'existe pas, l'en-tête part vide et le
  #    scan subit les protections comme n'importe quel robot.
  # ──────────────────────────────────────────────────────────────
  dast:
    name: DAST ZAP sur staging (${{ matrix.app }})
    runs-on: ubuntu-latest
    # Après `invalidate` (ignoré si le site n'a pas bougé) : scanner avant, c'est
    # lire l'ancien rendu encore en cache.
    needs: [deploy-apps, invalidate]
    if: always() && github.event_name != 'pull_request' && needs.deploy-apps.result == 'success' && (needs.invalidate.result == 'success' || needs.invalidate.result == 'skipped')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: website
            target: https://staging-www.nozaybad.fr
          - app: storefront
            target: https://staging-my.nozaybad.fr
    steps:
      # Pour .zap/rules.tsv seulement.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ZAP baseline (${{ matrix.target }})
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ matrix.target }}
          rules_file_name: .zap/rules.tsv
          artifact_name: zap-${{ matrix.app }}
          # Pas d'issue GitHub par verdict : le rapport est dans l'artefact du run.
          allow_issue_writing: false
          fail_action: ${{ env.DAST_BLOQUANT == 'true' }}
          cmd_options: >-
            -z "-config replacer.full_list(0).description=waf
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=X-Scan-Token
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=${{ secrets.ZAP_WAF_TOKEN }}"
