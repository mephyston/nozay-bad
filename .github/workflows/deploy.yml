name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

# Un seul déploiement à la fois par environnement
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # 'staging' sur la branche staging, vide (prod) sur main
  WRANGLER_ENV: ${{ github.ref_name == 'main' && '' || 'staging' }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Détecte les apps affectées avec nx affected
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      boutique: ${{ steps.affected.outputs.boutique }}
      admin-console: ${{ steps.affected.outputs.admin-console }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour nx affected (comparaison git)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Detect affected projects
        id: affected
        run: |
          # Sur main/staging : compare avec le commit précédent
          # Sur PR : compare avec la branche de base
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="HEAD~1"
          fi

          AFFECTED=$(npx nx show projects --affected --base=$BASE_SHA --head=HEAD 2>/dev/null || echo "")
          echo "Affected projects: $AFFECTED"

          echo "api=$(echo "$AFFECTED" | grep -w 'api' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT
          echo "boutique=$(echo "$AFFECTED" | grep -w 'boutique' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT
          echo "admin-console=$(echo "$AFFECTED" | grep -w 'admin-console' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # 2. Tests (toujours exécutés sur PR, skip sur push si rien d'affecté)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test affected
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run affected tests
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          npx nx affected -t test --base=$BASE_SHA --head=HEAD --parallel=3

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy API (en premier — les autres apps en dépendent)
  # ──────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: detect-changes
    # On déploie si l'API est affectée ET qu'on est sur main ou staging (pas sur PR)
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.api == '1'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --env staging cible nba-db-staging, sans flag cible nba-db (prod)
          npx wrangler d1 migrations apply nba-db${{ env.WRANGLER_ENV == 'staging' && '-staging' || '' }} --remote ${{ env.WRANGLER_ENV != '' && format('--env {0}', env.WRANGLER_ENV) || '' }}

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --env staging utilise le bloc env.staging du wrangler.json
        run: npx wrangler deploy ${{ env.WRANGLER_ENV != '' && format('--env {0}', env.WRANGLER_ENV) || '' }}

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy Boutique & Admin Console en parallèle
  #    (après l'API, car elles utilisent le Service Binding nba-api)
  # ──────────────────────────────────────────────────────────────
  deploy-boutique:
    name: Deploy Boutique Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-api]
    # Se lance même si deploy-api a été skippé (API non affectée)
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.boutique == '1' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Boutique (Astro SSR)
        working-directory: apps/boutique
        run: npx astro build

      - name: Deploy Boutique Worker
        working-directory: apps/boutique
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy ${{ env.WRANGLER_ENV != '' && format('--env {0}', env.WRANGLER_ENV) || '' }}

  deploy-admin-console:
    name: Deploy Admin Console Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-api]
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.admin-console == '1' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Admin Console (Astro SSR)
        working-directory: apps/admin-console
        run: npx astro build

      - name: Deploy Admin Console Worker
        working-directory: apps/admin-console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy ${{ env.WRANGLER_ENV != '' && format('--env {0}', env.WRANGLER_ENV) || '' }}
