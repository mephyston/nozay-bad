name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force le déploiement de toutes les applications"
        type: boolean
        default: true

# Un seul déploiement à la fois par branche
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Détecte les apps affectées avec nx affected
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      storefront: ${{ steps.affected.outputs.storefront }}
      admin: ${{ steps.affected.outputs.admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Detect affected projects
        id: affected
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          if [ "${{ github.event.inputs.force_all }}" = "true" ] || echo "$COMMIT_MSG" | grep -qiE "force deploy|deploy all"; then
            echo "Forcing deployment of all applications"
            API_COUNT=1
            STOREFRONT_COUNT=1
            ADMIN_COUNT=1
          else
            AFFECTED=$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD 2>/dev/null || echo "")
            echo "Affected projects: [$AFFECTED]"

            API_COUNT=$(echo "$AFFECTED" | grep -cw 'api' || true)
            STOREFRONT_COUNT=$(echo "$AFFECTED" | grep -cw 'storefront' || true)
            ADMIN_COUNT=$(echo "$AFFECTED" | grep -cw 'admin' || true)
          fi

          echo "api=$API_COUNT" >> $GITHUB_OUTPUT
          echo "storefront=$STOREFRONT_COUNT" >> $GITHUB_OUTPUT
          echo "admin=$ADMIN_COUNT" >> $GITHUB_OUTPUT

          echo "Debug outputs → api=$API_COUNT storefront=$STOREFRONT_COUNT admin=$ADMIN_COUNT"

  # ──────────────────────────────────────────────────────────────
  # 2. Tests sur PR uniquement
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test affected
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Run affected tests
        run: |
          npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=3

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy API (en premier — les autres apps en dépendent via Service Binding)
  # ──────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.api == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler d1 migrations apply nba-db --remote
          else
            npx wrangler d1 migrations apply nba-db-staging --remote --env staging
          fi

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy Storefront & Admin en parallèle (après API)
  # ──────────────────────────────────────────────────────────────
  deploy-storefront:
    name: Deploy Storefront Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.storefront == '1' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storefront (Astro SSR)
        working-directory: apps/storefront
        run: npx astro build

      - name: Deploy Storefront Worker
        working-directory: apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            delete cfg.images;
            if ('${{ github.ref_name }}' !== 'main') {
              cfg.name = 'nba-boutique-staging';
              cfg.services = [{ binding: 'API_SERVICE', service: 'nba-api-staging' }];
            }
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg, null, 2));
          "
          npx wrangler deploy

  deploy-admin:
    name: Deploy Admin Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.admin == '1' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Admin (Astro SSR)
        working-directory: apps/admin
        run: npx astro build

      - name: Deploy Admin Worker
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            delete cfg.images;
            if ('${{ github.ref_name }}' !== 'main') {
              cfg.name = 'nba-admin-console-staging';
              cfg.services = [{ binding: 'API_SERVICE', service: 'nba-api-staging' }];
            }
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg, null, 2));
          "
          npx wrangler deploy
