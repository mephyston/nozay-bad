name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force le déploiement de toutes les applications"
        type: boolean
        default: true

# Un seul déploiement à la fois par branche
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Détecte les apps affectées avec nx affected
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      boutique: ${{ steps.affected.outputs.boutique }}
      admin_console: ${{ steps.affected.outputs.admin_console }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Detect affected projects
        id: affected
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          if [ "${{ github.event.inputs.force_all }}" = "true" ] || echo "$COMMIT_MSG" | grep -qiE "force deploy|deploy all"; then
            echo "Forcing deployment of all applications"
            API_COUNT=1
            BOUTIQUE_COUNT=1
            ADMIN_COUNT=1
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            else
              BASE_SHA="HEAD~1"
            fi

            AFFECTED=$(npx nx show projects --affected --base=$BASE_SHA --head=HEAD 2>/dev/null || echo "")
            echo "Affected projects: [$AFFECTED]"

            API_COUNT=$(echo "$AFFECTED" | grep -cw 'api' || true)
            BOUTIQUE_COUNT=$(echo "$AFFECTED" | grep -cw 'boutique' || true)
            ADMIN_COUNT=$(echo "$AFFECTED" | grep -cw 'admin-console' || true)
          fi

          echo "api=$API_COUNT" >> $GITHUB_OUTPUT
          echo "boutique=$BOUTIQUE_COUNT" >> $GITHUB_OUTPUT
          echo "admin_console=$ADMIN_COUNT" >> $GITHUB_OUTPUT

          echo "Debug outputs → api=$API_COUNT boutique=$BOUTIQUE_COUNT admin_console=$ADMIN_COUNT"

  # ──────────────────────────────────────────────────────────────
  # 2. Tests sur PR uniquement
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test affected
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run affected tests
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          npx nx affected -t test --base=$BASE_SHA --head=HEAD --parallel=3

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy API (en premier — les autres apps en dépendent via Service Binding)
  # ──────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.api == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler d1 migrations apply nba-db --remote
          else
            npx wrangler d1 migrations apply nba-db-staging --remote --env staging
          fi

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy Boutique & Admin Console en parallèle (après API)
  # ──────────────────────────────────────────────────────────────
  deploy-boutique:
    name: Deploy Boutique Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.boutique == '1' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Boutique (Astro SSR)
        working-directory: apps/boutique
        run: npx astro build

      - name: Deploy Boutique Worker
        working-directory: apps/boutique
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi

  deploy-admin-console:
    name: Deploy Admin Console Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.admin_console == '1' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Admin Console (Astro SSR)
        working-directory: apps/admin-console
        run: npx astro build

      - name: Deploy Admin Console Worker
        working-directory: apps/admin-console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi
