name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force le déploiement de toutes les applications"
        type: boolean
        default: true

# Un seul déploiement à la fois par branche
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Détecte les apps affectées avec nx affected
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      storefront: ${{ steps.affected.outputs.storefront }}
      admin: ${{ steps.affected.outputs.admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Detect affected projects
        id: affected
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          if [ "${{ github.event.inputs.force_all }}" = "true" ] || echo "$COMMIT_MSG" | grep -qiE "force deploy|deploy all"; then
            echo "Forcing deployment of all applications"
            API_AFFECTED="true"
            STOREFRONT_AFFECTED="true"
            ADMIN_AFFECTED="true"
          else
            AFFECTED=$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD 2>/dev/null || echo "")
            echo "Affected projects: [$AFFECTED]"

            if echo "$AFFECTED" | grep -qx 'api'; then API_AFFECTED="true"; else API_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'storefront'; then STOREFRONT_AFFECTED="true"; else STOREFRONT_AFFECTED="false"; fi
            if echo "$AFFECTED" | grep -qx 'admin'; then ADMIN_AFFECTED="true"; else ADMIN_AFFECTED="false"; fi
          fi

          echo "api=$API_AFFECTED" >> $GITHUB_OUTPUT
          echo "storefront=$STOREFRONT_AFFECTED" >> $GITHUB_OUTPUT
          echo "admin=$ADMIN_AFFECTED" >> $GITHUB_OUTPUT

          echo "Debug outputs → api=$API_AFFECTED storefront=$STOREFRONT_AFFECTED admin=$ADMIN_AFFECTED"

  # ──────────────────────────────────────────────────────────────
  # 2. Tests affectés (exécutés sur PR et sur Push)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test affected
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Verify environment variable & binding declarations
        run: node scripts/check-env-declarations.js

      - name: Run affected tests
        run: |
          npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=3

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy API (en premier — les autres apps en dépendent via Service Binding)
  # ──────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.api == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler d1 migrations apply nba-db --remote
          else
            npx wrangler d1 migrations apply nba-db-staging --remote --env staging
          fi

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy Storefront & Admin en parallèle (après API)
  # ──────────────────────────────────────────────────────────────
  deploy-storefront:
    name: Deploy Storefront Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, test, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.storefront == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storefront (Astro SSR)
        working-directory: apps/storefront
        run: npx astro build

      - name: Deploy Storefront Worker
        working-directory: apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            delete cfg.images;
            if (process.env.REF_NAME !== 'main') {
              cfg.name = 'nba-storefront-staging';
              cfg.services = [{ binding: 'API_SERVICE', service: 'nba-api-staging' }];
              cfg.kv_namespaces = [{ binding: 'RATE_LIMIT_KV', id: 'e1f0b19b7ea44399ba66d10fe7907ce9' }];
            }
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg, null, 2));
          "
          npx wrangler deploy

  deploy-admin:
    name: Deploy Admin Worker
    runs-on: ubuntu-latest
    needs: [detect-changes, test, deploy-api]
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.admin == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Admin (Astro SSR)
        working-directory: apps/admin
        run: npx astro build

      - name: Deploy Admin Worker
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            delete cfg.images;
            if (process.env.REF_NAME !== 'main') {
              cfg.name = 'nba-admin-staging';
              cfg.services = [{ binding: 'API_SERVICE', service: 'nba-api-staging' }];
            }
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg, null, 2));
          "
          npx wrangler deploy
