name: Update Visual Baselines

# Régénère les références PNG (-linux) de la régression visuelle et les commite
# sur la branche. À déclencher manuellement après un changement visuel assumé
# du design system. Tourne sur Linux (×1) pour matcher le job `visual` du
# pipeline de déploiement.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baselines:
    name: Régénérer et commiter les références
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Le jeton n'est pas laissé dans le dépôt de travail : il est passé au seul
          # `git push` qui en a besoin, en fin de job.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

      - name: Regenerate references
        run: npm run test:visual:update

      - name: Commit updated baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          # --cached voit aussi les fichiers nouvellement ajoutés (non suivis).
          if git diff --cached --quiet -- tests/visual; then
            echo "Aucune référence à mettre à jour."
            exit 0
          fi
          git commit -m "test(visual): update Linux baselines [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
