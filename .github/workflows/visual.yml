name: Visual Regression (Storybook)

# Régression visuelle du design system @nba/ui.
# Ne s'exécute que si le DS ou la config Storybook/Playwright change.
on:
  pull_request:
    branches: [main]
    paths:
      - 'libs/shared/ui/**'
      - 'apps/admin/src/styles/**'
      - '.storybook/**'
      - 'tests/visual/**'
      - 'playwright.config.ts'
      - 'scripts/serve-storybook.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Screenshot diff
    runs-on: ubuntu-latest
    # Conteneur officiel Playwright : navigateurs + polices identiques à ceux
    # ayant généré les références Linux commitées (indispensable au pixel-diff).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

      - name: Run visual regression
        run: npm run test:visual

      # En cas d'échec (drift OU baselines Linux manquantes au 1er run) :
      # récupère le rapport HTML et les PNG générés pour inspection/commit.
      - name: Upload report & snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            tests/visual/**/*.png
          retention-days: 14
