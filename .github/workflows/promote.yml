name: Promote to production

# Développement sur tronc unique : `main` déploie la préproduction en continu, et la
# production n'est déployée que par ce workflow, sur action volontaire.
#
# On promeut un COMMIT, pas un binaire. Astro/Vite inline PUBLIC_APP_ENV, la clé VAPID
# et les URL croisées au build : un bundle est cuit pour un environnement. Les versions
# Cloudflare, elles, sont propres à un Worker — on ne promeut pas une version de
# nba-api-staging vers nba-api. Le ref est donc reconstruit avec les valeurs de prod.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag (ex. v1.2.3) ou SHA complet à promouvoir"
        required: true
        type: string
      skip_migrations:
        description: "Ne pas appliquer les migrations D1 (reprise après échec partiel)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # nécessaire à `gh run list`

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Le ref promu doit être sur le tronc ET avoir été vert en préproduction.
  #    Aucune suite de tests n'est rejouée : elle l'a déjà été sur ce SHA.
  # ──────────────────────────────────────────────────────────────
  guard:
    name: Contrôle du ref promu
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Résoudre et contrôler
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED_REF: ${{ inputs.ref }}
        run: |
          SHA=$(git rev-parse HEAD)

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA n'est pas un ancêtre de main — on ne promeut que du tronc."
            exit 1
          fi

          GREEN=$(gh run list --workflow deploy.yml --commit "$SHA" --status success --json databaseId --jq 'length')
          if [ "$GREEN" -eq 0 ]; then
            echo "::error::aucun run vert de deploy.yml sur $SHA : ce commit n'est jamais passé par la préproduction."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # La version affichée n'est plus calculée ici : c'est l'action de déploiement
          # qui la résout, par la même règle que la préproduction. Le résumé s'en tient
          # donc à ce que ce job sait — le ref demandé et le commit qu'il désigne.
          echo "### Promotion de \`$PROMOTED_REF\` → \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────
  # 2. Migrations D1 puis API (les 3 autres Workers en dépendent).
  # ──────────────────────────────────────────────────────────────
  api:
    name: Migrations D1 + API (production)
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Le SHA figé, jamais le tag : un tag peut être déplacé entre les deux jobs.
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Journalisé avant application : la liste des migrations en attente est la
      # dernière chose lisible avant un changement irréversible.
      - name: Migrations D1 en attente (production)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list nba-db --remote

      - name: Appliquer les migrations D1 (production)
        if: ${{ !inputs.skip_migrations }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nba-db --remote

      - name: Déployer le Worker API (production)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  # ──────────────────────────────────────────────────────────────
  # 3. Les 3 applications Astro, inconditionnellement, en parallèle.
  #
  #    Pas de `nx affected` ici : on promeut un tag arbitraire dont on ignore l'écart
  #    avec ce qui tourne réellement en production. Une promotion doit être rejouable
  #    et ne dépendre que du ref promu. Les 4 Workers étant couplés par service
  #    bindings et libs partagées, une promotion partielle produirait une flotte
  #    mélangeant deux versions de @nba/db.
  # ──────────────────────────────────────────────────────────────
  apps:
    name: Déployer ${{ matrix.app }} (production)
    needs: [guard, api]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, website, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.guard.outputs.sha }}
          # Historique et tags complets : l'action lit `git describe` pour savoir quelle
          # version porte le commit promu.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/deploy-app
        with:
          app: ${{ matrix.app }}
          env: production
          # Rien à souffler ici : aucune release n'est publiée au moment de promouvoir,
          # l'action lit le tag du commit. Promouvoir un commit intermédiaire, non taggé,
          # affichait auparavant son SHA de quarante caractères dans le badge.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          node-version: ${{ env.NODE_VERSION }}

  # ──────────────────────────────────────────────────────────────
  # Invalider le cache du site public après le déploiement.
  #
  # La version de contenu entre dans la clé de cache des pages : l'incrémenter rend d'un
  # coup toutes les entrées précédentes inatteignables. Les handlers du CMS le font à
  # chaque publication, et `invalidatePublicContent` à chaque écriture sur les créneaux ou
  # les événements — mais rien ne le faisait pour un **déploiement**.
  #
  # Or un changement de gabarit ou de composant modifie le HTML à contenu identique : les
  # points de présence qui ont déjà la page continuaient de servir l'ancien rendu jusqu'à
  # l'expiration du TTL. Correction invisible, sans que rien ne le signale.
  #
  # Après le déploiement, jamais avant : invalider d'abord laisserait les requêtes
  # suivantes remplir le cache avec l'ancien code encore en ligne.
  #
  # Seulement si le site a été déployé — invalider sur une livraison d'API seule viderait
  # le cache pour rien.
  # ──────────────────────────────────────────────────────────────
  invalidate:
    name: Invalider le cache du site public (production)
    needs: [guard, apps]
    if: needs.apps.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Incrémenter cms_content_version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler d1 execute nba-db --remote
          --command "UPDATE cms_content_version SET version = version + 1, updated_at = unixepoch() WHERE id = 1;"
