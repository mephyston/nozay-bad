name: Rollback production

# Chaque `wrangler deploy` crée une version : `wrangler rollback` réactive n'importe
# laquelle des 100 dernières, immédiatement et sans reconstruire. Ce workflow n'ajoute
# donc aucune capacité — il met un bouton sur une possibilité qui existait déjà.
#
# Deux limites à connaître :
#   - rétention des 100 dernières versions seulement ;
#   - rollback REFUSÉ si un binding a changé entre les deux versions (KV, R2, D1,
#     queues). C'est une protection contre les incohérences de schéma. Dans ce cas, le
#     repli est de relancer promote.yml sur le tag précédent.
#
# Pourquoi 'tous' est le défaut. Les versions Cloudflare sont propres à chaque Worker et
# ne s'alignent pas sur les tags : en préproduction, `nx affected` saute les applications
# non touchées, donc leurs historiques sont clairsemés et décalés. En production en
# revanche, promote.yml redéploie les 4 sans condition — leurs historiques restent donc
# alignés promotion par promotion, et les ramener ensemble d'un cran repose la flotte sur
# la promotion précédente de façon cohérente. Ne ramener qu'un seul Worker recrée
# exactement l'écart de version entre libs partagées que la promotion évite.
on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker à ramener en arrière ('tous' préserve la cohérence de la flotte)"
        required: true
        type: choice
        default: tous
        options:
          - tous
          - nba-api
          - nba-storefront
          - nba-website
          - nba-admin
      version_id:
        description: "Identifiant de version (vide = précédente ; ignoré si worker = tous)"
        required: false
        type: string
      reason:
        description: "Motif, repris dans le résumé du run"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  rollback:
    name: Rollback ${{ inputs.worker }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Historique et tags complets : l'horizon de rollback se calcule en reliant
          # la dernière migration destructive au tag qui l'a publiée.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # `wrangler rollback` ne revient que sur le code : la base reste en avant. Une
      # migration destructive franchie ressuscite du code qui interroge un schéma amputé.
      # L'expand/contract borne ce risque à une version — au-delà, il faut le savoir.
      - name: Horizon de retour arrière
        run: |
          node scripts/rollback-horizon.mjs | tee /tmp/horizon.txt
          {
            echo '### Horizon de retour arrière'
            echo '```'
            cat /tmp/horizon.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Journalisé avant bascule : sans cette liste, on ne sait pas vers quoi on revient.
      - name: Déploiements actuels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for w in nba-api nba-storefront nba-website nba-admin; do
            if [ "${{ inputs.worker }}" = "tous" ] || [ "${{ inputs.worker }}" = "$w" ]; then
              echo "--- $w ---"
              npx wrangler deployments list --name "$w" | tail -8
            fi
          done

      - name: Rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "### Rollback de \`${{ inputs.worker }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Motif : ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          # --yes : la commande est interactive par défaut et bloquerait le runner.
          if [ "${{ inputs.worker }}" = "tous" ]; then
            # L'API en dernier : les trois autres l'appellent par service binding, on
            # préfère qu'elles reculent avant lui plutôt que l'inverse.
            for w in nba-storefront nba-website nba-admin nba-api; do
              echo "--- $w ---"
              npx wrangler rollback --name "$w" --message "${{ inputs.reason }}" --yes
            done
          else
            npx wrangler rollback --name "${{ inputs.worker }}" ${{ inputs.version_id }} --message "${{ inputs.reason }}" --yes
          fi

      - name: Déploiement résultant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for w in nba-api nba-storefront nba-website nba-admin; do
            if [ "${{ inputs.worker }}" = "tous" ] || [ "${{ inputs.worker }}" = "$w" ]; then
              echo "--- $w ---"
              npx wrangler deployments list --name "$w" | tail -8
            fi
          done
