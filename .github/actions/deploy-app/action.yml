name: Construire et déployer un Worker Astro
description: >
  Construit une application Astro avec les variables de build de l'environnement visé,
  applique le bloc env correspondant sur la configuration générée par l'adaptateur, puis
  déploie. Chemin de code unique partagé par deploy.yml (staging) et promote.yml
  (production) : c'est ce qui rend impossible qu'une promotion soit construite avec des
  valeurs de préproduction.

inputs:
  app:
    description: "storefront | website | admin"
    required: true
  env:
    description: "staging | production"
    required: true
  app-version:
    description: >
      Version que semantic-release vient de publier, quand il en a publié une. Simple
      indice : l'action sait résoudre seule ce qui tourne à partir des tags, et c'est
      elle qui décide. Vide en production, où rien n'est publié au moment de promouvoir.
    required: false
    default: ""
  github-token:
    description: "Jeton GitHub, pour régénérer CHANGELOG.md depuis les Releases"
    required: false
    default: ""
  api-token:
    description: "CLOUDFLARE_API_TOKEN"
    required: true
  account-id:
    description: "CLOUDFLARE_ACCOUNT_ID"
    required: true
  node-version:
    description: "Version de Node.js"
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - id: node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-deploy-${{ inputs.app }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-deploy-${{ inputs.app }}-

    # Les variables PUBLIC_* sont inlinées par Vite : elles doivent exister AVANT le
    # build, donc elles ne peuvent pas venir de dist/server/wrangler.json. Elles sont
    # dérivées plutôt que recopiées — la clé VAPID est lue dans apps/api/wrangler.json,
    # ce qui garantit qu'elle reste identique à celle du Worker qui signe les envois.
    # Les entrées passent par l'environnement et non par le gabarit `${{ }}` : même
    # venant d'une matrice, une valeur interpolée dans un script y est exécutée.
    - name: Résoudre les variables de build
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TARGET_ENV: ${{ inputs.env }}
      run: node scripts/build-env.mjs --app "$APP" --env "$TARGET_ENV" >> "$GITHUB_ENV"

    # Version affichée par le badge de la barre latérale et les écrans de démarrage.
    #
    # La règle vit dans le script, seul endroit qui décide, et partagé avec la
    # production : les deux chemins la calculaient chacun de son côté et ne rendaient
    # même pas le même format. Il écrit VITE_APP_VERSION dans $GITHUB_ENV.
    #
    # Il lit les tags : le checkout de l'appelant doit être complet (`fetch-depth: 0`),
    # sinon `git describe` ne trouve rien et tout retombe sur « 0.0.0 ».
    - name: Résoudre la version affichée
      shell: bash
      env:
        APP_VERSION: ${{ inputs.app-version }}
        TARGET_ENV: ${{ inputs.env }}
      run: |
        node scripts/resolve-app-version.mjs \
          --env "$TARGET_ENV" \
          --released "$APP_VERSION"

    # L'écran « Nouveautés » de l'admin importe CHANGELOG.md. Depuis le retrait de
    # @semantic-release/git, plus rien ne le met à jour dans le dépôt : on le
    # reconstitue ici depuis les Releases GitHub, qui en sont la source.
    - name: Régénérer le changelog
      if: inputs.app == 'admin'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node scripts/generate-changelog.mjs

    - name: Construire ${{ inputs.app }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: npx nx build "$APP"

    # Garde-fou anti-promotion-contaminée : le bundle ne doit contenir aucun marqueur de
    # l'autre environnement. astro.config.mjs retombe sur 'production' quand
    # PUBLIC_APP_ENV est absent, donc un oubli ne se voit pas autrement.
    - name: Vérifier le bundle
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TARGET_ENV: ${{ inputs.env }}
      run: node scripts/build-env.mjs --app "$APP" --env "$TARGET_ENV" --verify

    - name: Appliquer la configuration d'environnement
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TARGET_ENV: ${{ inputs.env }}
      run: node scripts/patch-wrangler.mjs --app "$APP" --env "$TARGET_ENV"

    - name: Déployer
      shell: bash
      working-directory: apps/${{ inputs.app }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: npx wrangler deploy
